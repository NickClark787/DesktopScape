# Release pipeline — runs only on version tag push (v*.*.*).
#
# Builds the Windows NSIS installer and attaches it to a GitHub Release.
# This is the only place the heavy electron-builder chain runs; CI per-PR
# stays fast by skipping it.
#
# Trigger from local once the release commit is on main:
#   git tag v0.1.0
#   git push origin v0.1.0
#
# The runner is windows-latest because electron-builder's NSIS target needs
# native Windows tooling.
#
# The winCodeSign symlink quirk DOES affect GitHub Actions runners — an
# earlier version of this comment claimed otherwise, and the v0.1.0 tag
# failed on exactly that. electron-builder fetches the winCodeSign bundle
# during signApp; the archive carries macOS symlinks
# (darwin/10.12/lib/libcrypto.dylib and libssl.dylib), and extracting a
# symlink on Windows needs SeCreateSymbolicLinkPrivilege, which the runner
# account does not hold by default:
#
#   ERROR: Cannot create symbolic link : A required privilege is not held
#          by the client
#
# The "Allow unprivileged symlink creation" step below grants it via the
# Developer Mode registry flag before the build runs. Runners are
# administrators, so the write succeeds.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write  # needed to create the GitHub Release and upload artifacts

jobs:
  windows-installer:
    name: Build Windows installer (NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Re-run the cheap guard rails before shipping. If something regressed
      # between merge-to-main and tagging, we want to know before producing
      # a release artifact users will install.
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Reference-loadout validator
        run: npx tsx --tsconfig scripts/tsconfig.json scripts/validate-bis.mts

      # electron-builder's winCodeSign bundle contains macOS symlinks, and
      # 7za cannot unpack them without SeCreateSymbolicLinkPrivilege. The
      # Developer Mode flag grants it process-wide. See the header comment.
      - name: Allow unprivileged symlink creation (winCodeSign extraction)
        shell: pwsh
        run: |
          New-Item -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" -Force | Out-Null
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" `
            -Name "AllowDevelopmentWithoutDevLicense" -Value 1 -Type DWord
          Write-Host "Developer Mode enabled for symlink extraction."

      - name: Build app + Windows installer
        # electron-vite build is included in `dist:win`; run it directly so
        # any bundling failure surfaces clearly instead of buried in the
        # electron-builder logs.
        run: npm run dist:win

      # Named "always" but had no `if:`, so it was skipped on the one run
      # where inspection actually mattered. Uploads whatever exists even
      # when the build failed; a missing exe is then a warning, not a
      # second failure stacked on the first.
      - name: Upload installer artifact (always, for inspection)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DesktopScape-Windows-x64
          path: |
            release/*.exe
            release/*.exe.blockmap
          if-no-files-found: warn

      - name: Create GitHub Release with installer
        uses: softprops/action-gh-release@v2
        with:
          # The .blockmap is used by electron-updater for delta updates if/when
          # we wire that up; including it here is cheap and forward-compatible.
          files: |
            release/*.exe
            release/*.exe.blockmap
          generate_release_notes: true
          draft: true   # leave the release as a draft so the human can edit
                        # the changelog and publish manually. Flip to false
                        # once we trust the auto-generated notes.
